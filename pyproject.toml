[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamer-drift-diffusion"
version = "0.1.0"
description = "Python translation of the axisymmetric Julia streamer simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "ruamel.yaml>=0.18", "numba>=0.68.1", "xarray>=2025.1", "zarr>=3.0", "tyro>=1.0"]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6"]
test = ["fipy>=4.0.3,<4.1"]

[project.scripts]
streamer-python = "streamer_drift_diffusion.__main__:main"

[tool.setuptools.packages.find]
include = ["streamer_drift_diffusion*"]

[tool.setuptools.package-data]
streamer_drift_diffusion = ["data/*.txt", "data/*.yaml"]
