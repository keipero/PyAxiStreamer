description: >
  Dry-air mechanism for primary and secondary streamers, ported from the 1.5D model
  (1Dstreamer/streamer_1d: data/cantera/streamer_air.yaml with R4-R6, R10-R17 enabled, and
  data/cantera/secondary_extension.yaml).  Electron-impact rates use the Biagi cross sections
  (Bolsig/Biagi_N2_O2_1026.txt; channels C33, C46, C47, C48, C61).  Coefficients are SI per
  particle (two-body m^3/s, three-body m^6/s).  Neutral excited states that do not react back
  (vibrational and other electronic levels) are omitted; N2(C) is kept for emission diagnostics.
  Coefficients of the extension were taken from the tables reproduced in Teunissen et al.,
  arXiv:2412.03861v2 (Tables 4-6); check them against the original papers before quantitative use.

species:
  N: {field: n_atom, N: 1}
  N4+: {field: n4p, N: 4, charge: 1}
  O4+: {field: o4p, O: 4, charge: 1}
  N2O2+: {field: n2o2p, N: 2, O: 2, charge: 1}
  O3-: {field: o3m, O: 3, charge: -1}
  N2(C): {field: n2c, N: 2}

reactions:
  # --- electron impact (Biagi cross sections through Py3BOLOS) ----------------------------
  - id: ION_N2
    reactants: {Electron: 1, N2: 1}
    products: {Electron: 2, N2+: 1}
    rate: {collision: {kind: IONIZATION, target: N2, product: "+IONIZEDN2"}}
    photoionizing: true
  - id: ION_O2
    reactants: {Electron: 1, O2: 1}
    products: {Electron: 2, O2+: 1}
    rate: {collision: {kind: IONIZATION, target: O2, product: "+IONIZEDO2"}}
    photoionizing: true
  - id: ATT2_O2
    reactants: {Electron: 1, O2: 1}
    products: {O-: 1, O: 1}
    rate: {collision: {kind: ATTACHMENT, target: O2, product: O-+O}}
  # C47 is normalized to the gas density; the 1.5D default third body is the total gas.
  - id: ATT3_O2
    reactants: {Electron: 1, O2: 2}
    products: {O2-: 1, O2: 1}
    rate: {collision: {kind: ATTACHMENT, target: O2, product: O2-, density_normalized_cm3: true}}
  - id: ATT3_N2
    reactants: {Electron: 1, O2: 1, N2: 1}
    products: {O2-: 1, N2: 1}
    rate: {collision: {kind: ATTACHMENT, target: O2, product: O2-, density_normalized_cm3: true}}
  - id: R6_N2C_excitation
    reactants: {Electron: 1, N2: 1}
    products: {Electron: 1, N2(C): 1}
    rate: {collision: {kind: EXCITATION, target: N2, product: "N2(C3PIV=0-4)"}}

  # --- recombination (Komuro et al. 2012, Table 1) ---------------------------------------
  - id: R10_N2p_dissociative_recombination  # 2.8e-13 (300/Te)^0.5 m3/s
    reactants: {Electron: 1, N2+: 1}
    products: {N: 2}
    rate: {electron_temperature: {A: 4.8497422611928575e-12, b: -0.5}}
  - id: R11_O2p_dissociative_recombination  # 2.1e-13 (300/Te)^0.5 m3/s
    reactants: {Electron: 1, O2+: 1}
    products: {O: 2}
    rate: {electron_temperature: {A: 3.6373066958946425e-12, b: -0.5}}
  - id: R12_N2p_recombination
    reactants: {Electron: 1, N2+: 1}
    products: {N2: 1}
    rate: {constant: 4.0e-18}
  - id: R13_O2p_recombination
    reactants: {Electron: 1, O2+: 1}
    products: {O2: 1}
    rate: {constant: 4.0e-18}
  - id: R14_N2p_Om
    reactants: {N2+: 1, O-: 1}
    products: {N2: 1, O: 1}
    rate: {constant: 4.0e-13}
  - id: R15_N2p_O2m
    reactants: {N2+: 1, O2-: 1}
    products: {N2: 1, O2: 1}
    rate: {constant: 1.6e-13}
  - id: R16_O2p_Om
    reactants: {O2+: 1, O-: 1}
    products: {O2: 1, O: 1}
    rate: {constant: 9.6e-14}
  - id: R17_O2p_O2m
    reactants: {O2+: 1, O2-: 1}
    products: {O2: 2}
    rate: {constant: 4.2e-13}

  # --- positive-ion conversion (secondary extension) -------------------------------------
  - id: X1_N4_formation_N2      # 5.0e-29 (300/T)^2 cm6/s, Malagon-Romero R30
    reactants: {N2+: 1, N2: 2}
    products: {N4+: 1, N2: 1}
    rate: {arrhenius: {A: 4.4999999999999996e-36, b: -2.0}}
  - id: X1_N4_formation_O2
    reactants: {N2+: 1, N2: 1, O2: 1}
    products: {N4+: 1, O2: 1}
    rate: {arrhenius: {A: 4.4999999999999996e-36, b: -2.0}}
  - id: X2_N4_charge_transfer   # 2.5e-10 cm3/s, Malagon-Romero R31
    reactants: {N4+: 1, O2: 1}
    products: {O2+: 1, N2: 2}
    rate: {constant: 2.5e-16}
  - id: X3_N2_charge_transfer   # 6.0e-11 cm3/s, Starikovskiy R12
    reactants: {N2+: 1, O2: 1}
    products: {O2+: 1, N2: 1}
    rate: {constant: 6.0e-17}
  - id: X4_O4_formation_N2      # 2.4e-30 (300/T)^3 cm6/s, Malagon-Romero R32
    reactants: {O2+: 1, O2: 1, N2: 1}
    products: {O4+: 1, N2: 1}
    rate: {arrhenius: {A: 6.48e-35, b: -3.0}}
  - id: X4_O4_formation_O2
    reactants: {O2+: 1, O2: 2}
    products: {O4+: 1, O2: 1}
    rate: {arrhenius: {A: 6.48e-35, b: -3.0}}
  - id: X5_N2O2_formation       # 9.0e-31 (300/T)^2 cm6/s, Komuro R45
    reactants: {O2+: 1, N2: 2}
    products: {N2O2+: 1, N2: 1}
    rate: {arrhenius: {A: 8.100000000000001e-38, b: -2.0}}
  - id: X6_N2O2_dissociation    # 1.1e-6 (300/T)^5.3 exp(-2357/T) cm3/s, Komuro R59
    reactants: {N2O2+: 1, N2: 1}
    products: {O2+: 1, N2: 2}
    rate: {arrhenius: {A: 14.795693808580722, b: -5.3, Ea: 2357.0}}
  - id: X7_O4_from_N2O2         # 1.0e-9 cm3/s, Komuro R60
    reactants: {N2O2+: 1, O2: 1}
    products: {O4+: 1, N2: 1}
    rate: {constant: 1.0e-15}
  - id: X8_O4_switching         # 4.6e-12 (T/300)^2.5 exp(-2650/T) cm3/s, Komuro R50
    reactants: {O4+: 1, N2: 1}
    products: {N2O2+: 1, O2: 1}
    rate: {arrhenius: {A: 2.950901375858087e-24, b: 2.5, Ea: 2650.0}}
  - id: X9_O4_dissociation      # 3.3e-6 (300/T)^4 exp(-5030/T) cm3/s, Komuro R51
    reactants: {O4+: 1, O2: 1}
    products: {O2+: 1, O2: 2}
    rate: {arrhenius: {A: 0.02673, b: -4.0, Ea: 5030.0}}

  # --- electron recombination with cluster ions ------------------------------------------
  - id: X10_N4_recombination    # 2.0e-6 (300/Te)^0.5 cm3/s, Komuro R66
    reactants: {Electron: 1, N4+: 1}
    products: {N2: 2}
    rate: {electron_temperature: {A: 3.464101615137755e-11, b: -0.5}}
  - id: X11_O4_recombination    # 1.4e-6 (300/Te)^0.5 cm3/s, Malagon-Romero R38
    reactants: {Electron: 1, O4+: 1}
    products: {O2: 2}
    rate: {electron_temperature: {A: 2.4248711305964285e-11, b: -0.5}}

  # --- negative ions: detachment and conversion (E/N fits) -------------------------------
  - id: X12_O2m_detachment_N2   # 1.24e-11 exp(-(179/(8.8+E/N))^2) cm3/s, Malagon-Romero R15
    reactants: {O2-: 1, N2: 1}
    products: {Electron: 1, O2: 1, N2: 1}
    rate: {field: {A: 1.24e-17, B: 179.0, C: 8.8}}
  - id: X12_O2m_detachment_O2
    reactants: {O2-: 1, O2: 1}
    products: {Electron: 1, O2: 2}
    rate: {field: {A: 1.24e-17, B: 179.0, C: 8.8}}
  - id: X13_Om_detachment       # 1.16e-12 exp(-(48.9/(11+E/N))^2) cm3/s, Malagon-Romero R16
    reactants: {O-: 1, N2: 1}
    products: {Electron: 1, N2O: 1}
    rate: {field: {A: 1.16e-18, B: 48.9, C: 11.0}}
  - id: X14_Om_charge_transfer  # 6.96e-11 exp(-(198/(5.6+E/N))^2) cm3/s, Malagon-Romero R19
    reactants: {O-: 1, O2: 1}
    products: {O2-: 1, O: 1}
    rate: {field: {A: 6.96e-17, B: 198.0, C: 5.6}}
  - id: X15_O3m_formation_N2    # 1.1e-30 exp(-(E/N/65)^2) cm6/s, Malagon-Romero R18
    reactants: {O-: 1, O2: 1, N2: 1}
    products: {O3-: 1, N2: 1}
    rate: {field: {A: 1.1e-42, D: 65.0}}
  - id: X15_O3m_formation_O2
    reactants: {O-: 1, O2: 2}
    products: {O3-: 1, O2: 1}
    rate: {field: {A: 1.1e-42, D: 65.0}}

  # --- ion-ion recombination of the new ions (generic 1e-7 cm3/s, products assumed) ------
  - {id: X16_N4p_Om, reactants: {N4+: 1, O-: 1}, products: {N2: 2, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_N4p_O2m, reactants: {N4+: 1, O2-: 1}, products: {N2: 2, O2: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_N4p_O3m, reactants: {N4+: 1, O3-: 1}, products: {N2: 2, O2: 1, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_O4p_Om, reactants: {O4+: 1, O-: 1}, products: {O2: 2, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_O4p_O2m, reactants: {O4+: 1, O2-: 1}, products: {O2: 3}, rate: {constant: 1.0e-13}}
  - {id: X16_O4p_O3m, reactants: {O4+: 1, O3-: 1}, products: {O2: 3, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_N2O2p_Om, reactants: {N2O2+: 1, O-: 1}, products: {N2: 1, O2: 1, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_N2O2p_O2m, reactants: {N2O2+: 1, O2-: 1}, products: {N2: 1, O2: 2}, rate: {constant: 1.0e-13}}
  - {id: X16_N2O2p_O3m, reactants: {N2O2+: 1, O3-: 1}, products: {N2: 1, O2: 2, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_N2p_O3m, reactants: {N2+: 1, O3-: 1}, products: {N2: 1, O2: 1, O: 1}, rate: {constant: 1.0e-13}}
  - {id: X16_O2p_O3m, reactants: {O2+: 1, O3-: 1}, products: {O2: 2, O: 1}, rate: {constant: 1.0e-13}}

  # --- N2(C) losses (emission diagnostic; not in the 1.5D secondary configuration) -------
  # Midpoints of the v=0 bounds in 1Dstreamer data/n2_c_quenching/reference.json.
  - id: N2C_radiation           # 1/tau_C0, tau_C0 = 3.95e-8 s
    reactants: {N2(C): 1}
    products: {N2: 1}
    rate: {constant: 2.5316455696202532e7}
  - id: N2C_quenching_N2
    reactants: {N2(C): 1, N2: 1}
    products: {N2: 2}
    rate: {constant: 1.25e-17}
  - id: N2C_quenching_O2
    reactants: {N2(C): 1, O2: 1}
    products: {N2: 1, O2: 1}
    rate: {constant: 2.85e-16}
